project:
  name: DeepVision AI
  version: 2.0

paths:
  raw_data: data/raw
  processed_data: data/processed
  sequences: data/intermediate/sequences
  outputs: outputs
  checkpoints: outputs/checkpoints
  logs: outputs/logs
  metrics: outputs/metrics
  predictions: outputs/predictions

dataset:
  name: FFPP_CelebDF
  image_size: 224
  sequence_length: 30
  fps: 5

dataloader:
  batch_size: 4
  num_workers: 0
  pin_memory: true
  drop_last: false

training:
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: AdamW
  scheduler: CosineAnnealingLR

model:
  name: vit_temporal_pooling
  pretrained: true
  freeze_backbone: true
  num_classes: 2
  pooling: mean
  hidden_dim: 256
  dropout: 0.5

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1